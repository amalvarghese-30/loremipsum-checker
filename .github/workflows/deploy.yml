name: Test and Deploy to Live VPS

on:
  push:
    branches: [ main, 'corrective/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, curl, dom, json, mbstring
          coverage: none

      - name: Validate PHP Syntax (Lint)
        run: |
          echo "Linting all PHP files..."
          find . -type f -name "*.php" -not -path "*/vendor/*" -exec php -l {} +

      - name: Run Complete Test Suite
        run: |
          set -eo pipefail
          php tests/run_tests.php 2>&1 | tee test_output.log
          cat test_output.log >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Live VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying updates to Lorem Ipsum Checker..."
            
            # Navigate to project directory on VPS
            cd /root/loremipsum-checker
            
            # Pull latest changes from GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # Run any pending database migrations
            php database/migrate.php
            
            # Fix file permissions for data folder and scripts
            chown -R www-data:www-data data
            chmod -R 775 data
            chmod 755 worker.php database/migrate.php
            
            echo "✅ Deployment complete!"
