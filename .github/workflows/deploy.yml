name: Deploy to Live VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying updates to Lorem Ipsum Checker..."
            
            # Navigate to project directory on VPS
            cd /var/www/html/loremipsum-checker
            
            # Pull latest changes from GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # Run any pending database migrations
            php database/migrate.php
            
            # Fix file permissions
            chown -R www-data:www-data /var/www/html/loremipsum-checker
            chmod -R 775 data
            chmod 755 worker.php database/migrate.php
            
            echo "✅ Deployment complete!"
